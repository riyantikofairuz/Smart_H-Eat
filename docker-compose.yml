services:
  nginx:
    image: nginx:stable-alpine
    container_name: smartheat_nginx
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    image: smartheat-php:1.0
    container_name: smartheat_php
    volumes:
      - ./backend:/var/www/html
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: smartheat_db
      DB_USERNAME: smartheat_user
      DB_PASSWORD: smartheat_pass
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: smartheat_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: smartheat_db
      MYSQL_USER: smartheat_user
      MYSQL_PASSWORD: smartheat_pass
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: smartheat_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db

volumes:
  db_data: